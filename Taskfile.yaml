version: '3'

vars:
  MACOS_SDK_VERSION:
    sh: xcrun --show-sdk-version 2>/dev/null || sw_vers -productVersion

# Set globally so every task that invokes `go` (build, test, vet, run) uses
# the same deployment target as the installed SDK.  This prevents the linker
# warning "building for macOS-11.0, but linking with dylib built for 26.x"
# that otherwise appears whenever CGO-linked dylibs (e.g. Homebrew FFmpeg)
# target a newer OS than Go's hardcoded 11.0 minimum.
env:
  CGO_LDFLAGS: "-mmacosx-version-min={{.MACOS_SDK_VERSION}}"

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  dev:
    desc: Start Wails v3 dev server (Vite + Go app in parallel)
    cmds:
      - npm install --prefix frontend
      - npm run dev --prefix frontend &
      - go run .

  build:
    desc: Build the application binary (frontend then Go embed)
    cmds:
      - npm install --prefix frontend
      - npm run build --prefix frontend
      - mkdir -p build/bin
      - go build -o build/bin/lumivue .

  build:prod:
    desc: Build the application binary (production, minified frontend)
    cmds:
      - npm install --prefix frontend
      - npm run build --prefix frontend
      - mkdir -p build/bin
      - go build -ldflags="-s -w" -o build/bin/lumivue .

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  test:verbose:
    desc: Run all Go tests with verbose output
    cmds:
      - go test -v ./...

  lint:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format all Go source files
    cmds:
      - go fmt ./...

  tidy:
    desc: Tidy and verify go modules
    cmds:
      - go mod tidy
      - go mod verify

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf build/bin
      - rm -rf frontend/dist
      - rm -rf frontend/node_modules

  check:
    desc: Run fmt, lint, and test
    cmds:
      - task: fmt
      - task: lint
      - task: test
