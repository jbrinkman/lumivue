version: '3'

tasks:
  go:mod:tidy:
    internal: true
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    internal: true
    run: once
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    cmds:
      - npm ci

  generate:bindings:
    internal: true
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "../../*.go"
      - "../../go.mod"
      - "../../go.sum"
    generates:
      - ../../frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '-tags production' -clean=true -time-type=Date

  build:frontend:
    internal: true
    run: once
    dir: frontend
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    cmds:
      - npm run build
